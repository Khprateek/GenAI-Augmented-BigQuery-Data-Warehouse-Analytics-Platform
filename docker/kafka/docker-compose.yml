services:
  kafka:
    image: apache/kafka:latest
    container_name: quickcommerce-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./bootstrap_topics.sh:/tmp/bootstrap_topics.sh

  init-kafka:
    image: apache/kafka:latest
    container_name: quickcommerce-init-kafka
    depends_on:
      - kafka
    entrypoint: [ "/bin/bash", "/tmp/bootstrap_topics.sh" ]
    volumes:
      - ./bootstrap_topics.sh:/tmp/bootstrap_topics.sh

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: quickcommerce-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: quickcommerce
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092